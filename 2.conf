app_id="2"
app_name="claude-mem 跨会话记忆"
app_category="tools"
app_text="Claude Code 持久记忆插件：自动记住项目上下文，换会话不断片"

# 磁盘检查需要的变量（框架安装流程要求，CLI 插件给 1GB 即可）
app_size="1"

# CLI 插件类应用：清空框架的 Docker 容器变量（避免无意义的容器检查报错）
docker_name=""
docker_port=""

# 覆盖框架默认的容器状态检查：只在本应用生效，其他应用走原版
if declare -f check_docker_app >/dev/null 2>&1; then
    eval "framework_$(declare -f check_docker_app)"
    check_docker_app() {
        if [ "${app_name:-}" = "claude-mem 跨会话记忆" ]; then
            if grep -q "claude-mem" ~/.claude/settings.json 2>/dev/null || [ -d "$HOME/.claude-mem" ]; then
                check_docker="${gl_lv}已安装${gl_bai}"
            else
                check_docker="${gl_hui}未安装${gl_bai}"
            fi
        else
            framework_check_docker_app
        fi
    }
fi

docker_app_install() {
    clear
    echo -e "\033[96m==================================================\033[0m"
    echo -e "\033[32m  🚀 [z app 2] claude-mem 正在安装...\033[0m"
    echo -e "\033[96m==================================================\033[0m"
    local node_ok=0
    if command -v node >/dev/null 2>&1; then
        local major
        major=$(node -v 2>/dev/null | sed 's/^v//' | cut -d. -f1)
        if [ -n "$major" ] && [ "$major" -ge 20 ] 2>/dev/null; then
            node_ok=1
        fi
    fi
    if [ "$node_ok" != "1" ]; then
        echo -e "\033[33m未检测到 Node.js 20+，正在安装...\033[0m"
        if command -v apt >/dev/null 2>&1; then
            apt update && apt install -y nodejs npm
        elif command -v yum >/dev/null 2>&1; then
            yum install -y nodejs npm
        elif command -v apk >/dev/null 2>&1; then
            apk add nodejs npm
        else
            echo -e "\033[31m❌ 无法自动安装 Node.js，请手动安装 20+ 版本后重试\033[0m"
            return 1
        fi
    fi
    echo -e "Node 版本: $(node -v)"
    echo -e "\033[33m正在执行: npx claude-mem install\033[0m"
    if npx -y claude-mem install; then
        echo -e "\033[96m--------------------------------------------------\033[0m"
        echo -e "\033[32m✅ 安装成功！claude-mem 已接入 Claude Code。\033[0m"
        echo -e "下次开新会话会自动注入历史上下文。"
    else
        echo -e "\033[31m❌ 安装失败，请检查网络后重试\033[0m"
        return 1
    fi
    echo -e "\033[96m==================================================\033[0m"
}

docker_app_update() {
    echo "正在更新 claude-mem 到最新版（重跑官方安装）..."
    npx -y claude-mem install
}

docker_app_uninstall() {
    echo "正在卸载 claude-mem ..."
    # 1. 停掉残留的 observer / worker 进程
    pkill -f "claude-mem" 2>/dev/null || true
    # 2. 从 Claude Code 配置中移除 hooks（先备份原文件）
    if [ -f ~/.claude/settings.json ]; then
        local bak="$HOME/.claude/settings.json.bak.$(date +%Y%m%d%H%M%S)"
        cp -f ~/.claude/settings.json "$bak"
        if command -v python3 >/dev/null 2>&1; then
            python3 - "$HOME" <<'PYEOF'
import json, os, sys
p = os.path.join(sys.argv[1], '.claude', 'settings.json')
try:
    with open(p) as f:
        d = json.load(f)
except Exception as e:
    print("读取 settings.json 失败:", e)
    sys.exit(0)
changed = False
hooks = d.get('hooks')
if isinstance(hooks, dict):
    for ev in list(hooks.keys()):
        lst = hooks[ev]
        if isinstance(lst, list):
            new = [h for h in lst if 'claude-mem' not in json.dumps(h)]
            if len(new) != len(lst):
                changed = True
                if new:
                    hooks[ev] = new
                else:
                    del hooks[ev]
if changed:
    with open(p, 'w') as f:
        json.dump(d, f, indent=2, ensure_ascii=False)
    print("已从 settings.json 移除 claude-mem hooks（原文件已备份）")
else:
    print("settings.json 中未发现 claude-mem hooks")
PYEOF
        else
            echo "未找到 python3，跳过自动清理；已备份原文件，请手动删除其中的 claude-mem hooks"
        fi
    else
        echo "未发现 ~/.claude/settings.json，跳过 hooks 清理"
    fi
    # 3. 删除数据目录
    rm -rf ~/.claude-mem 2>/dev/null || true
    echo -e "${gl_lv}✅ 卸载完成${gl_bai}"
}

docker_app_plus
