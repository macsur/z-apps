app_id="2"
app_name="claude-mem 跨会话记忆"
app_category="tools"
app_text="Claude Code 持久记忆插件：自动记住项目上下文，换会话不断片"

docker_app_install() {
    clear
    echo -e "\033[96m==================================================\033[0m"
    echo -e "\033[32m  🚀 [z app 2] claude-mem 正在安装...\033[0m"
    echo -e "\033[96m==================================================\033[0m"
    local node_ok=0
    if command -v node >/dev/null 2>&1; then
        local major
        major=$(node -v 2>/dev/null | sed 's/^v//' | cut -d. -f1)
        if [ -n "$major" ] && [ "$major" -ge 20 ] 2>/dev/null; then
            node_ok=1
        fi
    fi
    if [ "$node_ok" != "1" ]; then
        echo -e "\033[33m未检测到 Node.js 20+，正在安装...\033[0m"
        if command -v apt >/dev/null 2>&1; then
            apt update && apt install -y nodejs npm
        elif command -v yum >/dev/null 2>&1; then
            yum install -y nodejs npm
        elif command -v apk >/dev/null 2>&1; then
            apk add nodejs npm
        else
            echo -e "\033[31m❌ 无法自动安装 Node.js，请手动安装 20+ 版本后重试\033[0m"
            return 1
        fi
    fi
    echo -e "Node 版本: $(node -v)"
    echo -e "\033[33m正在执行: npx claude-mem install\033[0m"
    if npx -y claude-mem install; then
        echo -e "\033[96m--------------------------------------------------\033[0m"
        echo -e "\033[32m✅ 安装成功！claude-mem 已接入 Claude Code。\033[0m"
        echo -e "下次开新会话会自动注入历史上下文。"
    else
        echo -e "\033[31m❌ 安装失败，请检查网络后重试\033[0m"
        return 1
    fi
    echo -e "\033[96m==================================================\033[0m"
}
docker_app_update() {
    echo "正在更新 claude-mem 到最新版（重跑官方安装）..."
    npx -y claude-mem install
}
docker_app_uninstall() {
    echo "正在卸载 claude-mem ..."
    if npx -y claude-mem uninstall 2>/dev/null; then
        echo "✅ 已卸载"
    else
        echo "官方未提供 uninstall 命令，请手动清理："
        echo "  1. 删除 ~/.claude/settings.json 中的 claude-mem hooks 配置"
        echo "  2. 删除 ~/.claude-mem/ 目录（如有）"
    fi
}
docker_app_plus
