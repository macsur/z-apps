app_id="3"
app_name="WorkBuddy 账号池网关"
app_category="ai"
app_text="第三方账号池 API 网关与管理面板：多账号轮换、OpenAI 兼容 /v1 接口"
app_size="2"
docker_name="workbuddy-manager"
docker_port="7864"
docker_describe="WorkBuddy 账号池网关与管理面板（网关 7863 + 面板 7864，均仅监听 127.0.0.1）"
docker_url="https://github.com/macsur/WorkBuddy"

WB_DEPLOY_URL="https://raw.githubusercontent.com/macsur/WorkBuddy/main/workbuddy-deploy.sh"
WB_BASE_DIR="/opt/wb2api"

docker_app_install() {
    clear
    echo -e "\033[96m==================================================\033[0m"
    echo -e "\033[32m  🚀 [z app 3] WorkBuddy 正在安装...\033[0m"
    echo -e "\033[96m==================================================\033[0m"
    echo -e "\033[33m正在下载部署脚本...\033[0m"
    local tmp_sh
    tmp_sh=$(mktemp /tmp/wb-deploy.XXXXXX.sh)
    if ! curl -fsSL --max-time 60 "$WB_DEPLOY_URL" -o "$tmp_sh"; then
        echo -e "\033[31m❌ 部署脚本下载失败，请检查网络后重试\033[0m"
        rm -f "$tmp_sh"
        return 1
    fi
    bash -n "$tmp_sh" || {
        echo -e "\033[31m❌ 部署脚本语法校验失败，已中止\033[0m"
        rm -f "$tmp_sh"
        return 1
    }
    echo -e "\033[33m启动交互式部署（按提示填写域名与管理密码）...\033[0m"
    echo ""
    if bash "$tmp_sh"; then
        echo ""
        echo -e "\033[32m✅ WorkBuddy 安装完成！\033[0m"
        echo -e "管理面板: \033[33mhttp://127.0.0.1:7864\033[0m（建议用上方菜单 5. 添加域名访问 配置反代）"
        echo -e "API 网关: \033[33mhttp://127.0.0.1:7863/v1\033[0m（OpenAI 兼容）"
        echo -e "凭据位置: \033[33m$WB_BASE_DIR/.credentials\033[0m"
    else
        echo -e "\033[31m❌ 部署脚本执行失败，请根据上方报错排查后重试\033[0m"
        rm -f "$tmp_sh"
        return 1
    fi
    rm -f "$tmp_sh"
    echo -e "\033[96m==================================================\033[0m"
}

docker_app_update() {
    echo "正在更新 WorkBuddy（部署脚本幂等，重跑即更新）..."
    local tmp_sh
    tmp_sh=$(mktemp /tmp/wb-deploy.XXXXXX.sh)
    curl -fsSL --max-time 60 "$WB_DEPLOY_URL" -o "$tmp_sh" || {
        echo -e "\033[31m❌ 部署脚本下载失败\033[0m"
        rm -f "$tmp_sh"
        return 1
    }
    bash "$tmp_sh" --auto
    local rc=$?
    rm -f "$tmp_sh"
    return $rc
}

docker_app_uninstall() {
    echo "正在卸载 WorkBuddy ..."
    docker rm -f workbuddy2api workbuddy-manager 2>/dev/null || true
    if [ -d "$WB_BASE_DIR" ]; then
        echo -e "\033[33m是否同时删除数据目录 $WB_BASE_DIR（含账号凭据）？(y/N)\033[0m"
        local ans
        read -r ans
        if [ "$ans" = "y" ] || [ "$ans" = "Y" ]; then
            rm -rf "$WB_BASE_DIR"
            echo "数据目录已删除"
        else
            echo "数据目录保留：$WB_BASE_DIR"
        fi
    fi
    echo -e "\033[32m✅ 卸载完成\033[0m"
}

docker_app_plus
