app_id="4"
app_name="木序定制 · 全屋定制平台"
app_category="tools"
app_text="全屋定制橱柜业务系统测试环境：客户端＋管理端＋Django 后端＋MySQL 一键拉起（上游 GitHub 项目，前端为演示数据）"
app_size="3"
docker_name="whole-house"
docker_port="5173"
docker_describe="木序定制 · 全屋定制平台（客户端: 5173，管理端: 5172，Django API: 8000/api/health/）"
docker_url="https://github.com/JamesRony-331/whole-house-customization"

WHC_BASE_DIR="/home/docker/whole-house"
WHC_SRC_DIR="$WHC_BASE_DIR/src"
WHC_REPO_URL="https://github.com/JamesRony-331/whole-house-customization.git"

docker_app_install() {
    clear
    echo -e "\033[96m==================================================\033[0m"
    echo -e "\033[32m  🚀 [z app 4] 木序定制 · 全屋定制平台 正在安装...\033[0m"
    echo -e "\033[96m==================================================\033[0m"

    # 1. 前置依赖检查
    if ! command -v docker >/dev/null 2>&1; then
        echo -e "\033[31m❌ 未检测到 docker，请先安装 Docker 后重试\033[0m"
        return 1
    fi

    if ! docker compose version >/dev/null 2>&1 && ! command -v docker-compose >/dev/null 2>&1; then
        echo -e "\033[31m❌ 未检测到 docker compose，请先安装 Docker Compose 后重试\033[0m"
        return 1
    fi

    if ! command -v git >/dev/null 2>&1; then
        echo -e "\033[31m❌ 未检测到 git，请先安装 git 后重试\033[0m"
        return 1
    fi

    local compose_cmd="docker compose"
    if ! docker compose version >/dev/null 2>&1; then
        compose_cmd="docker-compose"
    fi

    # 2. 已装检测：已有 whc- 容器组则提示并尝试启动
    local existing_containers
    existing_containers=$(docker ps -a --filter "name=whc-" --format '{{.Names}}' 2>/dev/null)
    if [ -n "$existing_containers" ]; then
        echo -e "\033[33m⚠️ 检测到全屋定制平台已有容器存在：\033[0m"
        echo "$existing_containers"
        local running_containers
        running_containers=$(docker ps --filter "name=whc-" --format '{{.Names}}' 2>/dev/null)
        if [ -n "$running_containers" ]; then
            echo -e "\033[32m✅ 容器组正在运行中，无需重复安装\033[0m"
        else
            echo -e "\033[33m正在尝试启动已存在的容器组...\033[0m"
            if [ -d "$WHC_BASE_DIR" ] && [ -f "$WHC_BASE_DIR/docker-compose.yml" ]; then
                (cd "$WHC_BASE_DIR" && $compose_cmd up -d) >/dev/null 2>&1
            else
                for c in $existing_containers; do
                    docker start "$c" >/dev/null 2>&1
                done
            fi
            echo -e "\033[32m✅ 容器组已启动\033[0m"
        fi
        echo -e "\033[96m==================================================\033[0m"
        return 0
    fi

    # 3. 准备部署目录与克隆/更新源码
    echo -e "\033[33m正在准备部署目录与源码: $WHC_BASE_DIR ...\033[0m"
    mkdir -p "$WHC_BASE_DIR" || {
        echo -e "\033[31m❌ 创建目录 $WHC_BASE_DIR 失败\033[0m"
        return 1
    }

    if [ -d "$WHC_SRC_DIR/.git" ]; then
        echo -e "\033[33m源码目录已存在，正在拉取最新代码...\033[0m"
        (cd "$WHC_SRC_DIR" && git pull) || echo -e "\033[33m⚠️ git pull 失败，将使用现有源码继续构建\033[0m"
    else
        echo -e "\033[33m正在克隆上游仓库: $WHC_REPO_URL ...\033[0m"
        rm -rf "$WHC_SRC_DIR" 2>/dev/null || true
        if ! git clone "$WHC_REPO_URL" "$WHC_SRC_DIR"; then
            echo -e "\033[31m❌ 克隆上游仓库失败，请检查网络\033[0m"
            return 1
        fi
    fi

    # 4. 生成动态随机密码并落目标机 .env
    local env_file="$WHC_BASE_DIR/.env"
    if [ ! -f "$env_file" ]; then
        local rand_db_pass rand_secret
        rand_db_pass=$(LC_ALL=C tr -dc 'A-Za-z0-9_#%&' < /dev/urandom 2>/dev/null | head -c 24 || date +%s%N | sha256sum | head -c 24)
        rand_secret=$(LC_ALL=C tr -dc 'A-Za-z0-9_#%&+' < /dev/urandom 2>/dev/null | head -c 50 || date +%s%N | sha256sum | head -c 50)
        cat <<EOF > "$env_file"
# 木序定制 · 全屋定制平台 自动生成环境配置
MYSQL_ROOT_PASSWORD=$rand_db_pass
MYSQL_DATABASE=whole_house_customization
DJANGO_SECRET_KEY=$rand_secret
DJANGO_ALLOWED_HOSTS=*
EOF
        chmod 600 "$env_file" 2>/dev/null || true
    fi

    # 5. 生成资产文件：Dockerfile 与 nginx.conf
    # 5.1 后端 Dockerfile (补齐 requirements 缺少的 cryptography)
    cat << 'EOF' > "$WHC_BASE_DIR/Dockerfile.backend"
FROM python:3.13-slim

WORKDIR /app

ENV PYTHONDONTWRITEBYTECODE=1
ENV PYTHONUNBUFFERED=1

COPY src/service/WholeHouse/requirements.txt /app/

RUN apt-get update && apt-get install -y --no-install-recommends \
    build-essential \
    default-libmysqlclient-dev \
    pkg-config \
    curl \
    && pip install --no-cache-dir -r requirements.txt \
    && pip install --no-cache-dir cryptography \
    && apt-get purge -y --auto-remove build-essential \
    && rm -rf /var/lib/apt/lists/*

COPY src/service/WholeHouse/ /app/

EXPOSE 8000

CMD ["python", "manage.py", "runserver", "0.0.0.0:8000", "--noreload"]
EOF

    # 5.2 Nginx SPA 前端配置模板
    cat << 'EOF' > "$WHC_BASE_DIR/nginx.spa.conf"
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
EOF

    # 5.3 客户端 Dockerfile (多段构建：node:22-alpine -> nginx:alpine)
    cat << 'EOF' > "$WHC_BASE_DIR/Dockerfile.client"
FROM node:22-alpine AS builder
WORKDIR /app
COPY src/client/@latest/package*.json ./
RUN npm ci || npm install
COPY src/client/@latest/ ./
RUN npm run build

FROM nginx:alpine
COPY --from=builder /app/dist /usr/share/nginx/html
COPY nginx.spa.conf /etc/nginx/conf.d/default.conf
EXPOSE 80
CMD ["nginx", "-g", "daemon off;"]
EOF

    # 5.4 管理端 Dockerfile (多段构建：node:22-alpine -> nginx:alpine)
    cat << 'EOF' > "$WHC_BASE_DIR/Dockerfile.admin"
FROM node:22-alpine AS builder
WORKDIR /app
COPY src/admin/@latest/package*.json ./
RUN npm ci || npm install
COPY src/admin/@latest/ ./
RUN npm run build

FROM nginx:alpine
COPY --from=builder /app/dist /usr/share/nginx/html
COPY nginx.spa.conf /etc/nginx/conf.d/default.conf
EXPOSE 80
CMD ["nginx", "-g", "daemon off;"]
EOF

    # 5.5 生成 docker-compose.yml 四服务编排
    cat << 'EOF' > "$WHC_BASE_DIR/docker-compose.yml"
services:
  whc-mysql:
    image: mysql:8
    container_name: whc-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - whc-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  whc-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: whc-backend
    restart: unless-stopped
    environment:
      DB_HOST: whc-mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
    ports:
      - "8000:8000"
    depends_on:
      whc-mysql:
        condition: service_healthy

  whc-client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: whc-client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - whc-backend

  whc-admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    container_name: whc-admin
    restart: unless-stopped
    ports:
      - "5172:80"
    depends_on:
      - whc-backend

volumes:
  whc-mysql-data:
EOF

    # 6. 构建并拉起容器组
    echo -e "\033[33m正在构建镜像并启动四容器服务 (MySQL 8 + Django + Client + Admin) ...\033[0m"
    if ! (cd "$WHC_BASE_DIR" && $compose_cmd up -d --build); then
        echo -e "\033[31m❌ Docker Compose 启动失败，最近 20 行日志：\033[0m"
        (cd "$WHC_BASE_DIR" && $compose_cmd logs --tail 20) 2>/dev/null || true
        return 1
    fi

    # 7. 轮询自检最多 60 秒 (5173, 5172, 8000/api/health/)
    echo -e "\033[33m正在等待服务就绪并执行健康自检 (最长 60 秒)...\033[0m"
    local check_passed=0
    local c5173_ok=0
    local c5172_ok=0
    local c8000_ok=0

    for i in $(seq 1 30); do
        if [ "$c5173_ok" -eq 0 ]; then
            if curl -sI --max-time 3 "http://127.0.0.1:5173/" 2>/dev/null | grep -q "200 OK"; then
                c5173_ok=1
            fi
        fi

        if [ "$c5172_ok" -eq 0 ]; then
            if curl -sI --max-time 3 "http://127.0.0.1:5172/" 2>/dev/null | grep -q "200 OK"; then
                c5172_ok=1
            fi
        fi

        if [ "$c8000_ok" -eq 0 ]; then
            local h_res
            h_res=$(curl -s --max-time 3 "http://127.0.0.1:8000/api/health/" 2>/dev/null || true)
            if echo "$h_res" | grep -q '"status":[[:space:]]*"ok"'; then
                c8000_ok=1
            fi
        fi

        if [ "$c5173_ok" -eq 1 ] && [ "$c5172_ok" -eq 1 ] && [ "$c8000_ok" -eq 1 ]; then
            check_passed=1
            break
        fi

        sleep 2
    done

    # 记录 appno 标记
    if [ "$check_passed" -eq 1 ]; then
        if declare -f add_app_id >/dev/null 2>&1; then
            add_app_id
        else
            mkdir -p /home/docker
            touch /home/docker/appno.txt
            grep -qxF "4" /home/docker/appno.txt 2>/dev/null || echo "4" >> /home/docker/appno.txt
        fi

        local server_ip
        server_ip=$(curl -s --max-time 3 ipinfo.io/ip 2>/dev/null || hostname -I 2>/dev/null | awk '{print $1}' || echo "127.0.0.1")
        [ -z "$server_ip" ] && server_ip="127.0.0.1"

        echo ""
        echo -e "\033[32m==================================================\033[0m"
        echo -e "\033[32m✅ 木序定制 · 全屋定制平台 安装并自检通过！\033[0m"
        echo -e "\033[32m==================================================\033[0m"
        echo -e "访问地址清单："
        echo -e "  • 客户端 (Vue3 展示端): \033[33mhttp://${server_ip}:5173\033[0m"
        echo -e "  • 管理端 (Vue3 管理台): \033[33mhttp://${server_ip}:5172\033[0m"
        echo -e "  • 后端 API (Django REST): \033[33mhttp://${server_ip}:8000/api/health/\033[0m"
        echo -e "部署资产路径: \033[33m$WHC_BASE_DIR\033[0m (含 .env 与 docker-compose.yml)"
        echo -e "说明: 前端当前为演示静态数据，Django 后端提供标准 RESTful API。"
        echo -e "\033[96m==================================================\033[0m"
        return 0
    else
        echo -e "\033[31m❌ 服务就绪自检超时失败，状态详情：\033[0m"
        [ "$c5173_ok" -eq 1 ] && echo -e "  • 5173 客户端: \033[32mOK (200)\033[0m" || echo -e "  • 5173 客户端: \033[31mFAIL\033[0m"
        [ "$c5172_ok" -eq 1 ] && echo -e "  • 5172 管理端: \033[32mOK (200)\033[0m" || echo -e "  • 5172 管理端: \033[31mFAIL\033[0m"
        [ "$c8000_ok" -eq 1 ] && echo -e "  • 8000 API健康接口: \033[32mOK\033[0m" || echo -e "  • 8000 API健康接口: \033[31mFAIL\033[0m"

        echo -e "\033[33m正在打印失败容器最近 20 行日志：\033[0m"
        if [ "$c8000_ok" -eq 0 ]; then
            echo -e "\033[33m--- [whc-backend logs] ---\033[0m"
            docker logs --tail 20 whc-backend 2>/dev/null || true
            echo -e "\033[33m--- [whc-mysql logs] ---\033[0m"
            docker logs --tail 20 whc-mysql 2>/dev/null || true
        fi
        if [ "$c5173_ok" -eq 0 ]; then
            echo -e "\033[33m--- [whc-client logs] ---\033[0m"
            docker logs --tail 20 whc-client 2>/dev/null || true
        fi
        if [ "$c5172_ok" -eq 0 ]; then
            echo -e "\033[33m--- [whc-admin logs] ---\033[0m"
            docker logs --tail 20 whc-admin 2>/dev/null || true
        fi
        return 1
    fi
}

docker_app_update() {
    echo "正在更新 木序定制 · 全屋定制平台 ..."
    if [ ! -d "$WHC_BASE_DIR" ] || [ ! -f "$WHC_BASE_DIR/docker-compose.yml" ]; then
        echo -e "\033[31m❌ 未找到部署目录 $WHC_BASE_DIR，请先执行安装\033[0m"
        return 1
    fi

    local compose_cmd="docker compose"
    if ! docker compose version >/dev/null 2>&1; then
        compose_cmd="docker-compose"
    fi

    if [ -d "$WHC_SRC_DIR/.git" ]; then
        echo -e "\033[33m正在拉取上游最新源码...\033[0m"
        (cd "$WHC_SRC_DIR" && git pull) || echo -e "\033[33m⚠️ 源码拉取失败，尝试重新构建现有源码\033[0m"
    fi

    echo -e "\033[33m重新构建并重启四容器服务...\033[0m"
    if ! (cd "$WHC_BASE_DIR" && $compose_cmd up -d --build); then
        echo -e "\033[31m❌ 重新构建启动失败\033[0m"
        return 1
    fi

    echo -e "\033[33m正在执行更新后自检...\033[0m"
    local check_passed=0
    for i in $(seq 1 30); do
        local h_res
        h_res=$(curl -s --max-time 3 "http://127.0.0.1:8000/api/health/" 2>/dev/null || true)
        if echo "$h_res" | grep -q '"status":[[:space:]]*"ok"'; then
            if curl -sI --max-time 3 "http://127.0.0.1:5173/" 2>/dev/null | grep -q "200 OK"; then
                if curl -sI --max-time 3 "http://127.0.0.1:5172/" 2>/dev/null | grep -q "200 OK"; then
                    check_passed=1
                    break
                fi
            fi
        fi
        sleep 2
    done

    if [ "$check_passed" -eq 1 ]; then
        echo -e "\033[32m✅ 木序定制 · 全屋定制平台 更新完成且自检通过！\033[0m"
        return 0
    else
        echo -e "\033[31m❌ 更新后自检未通过，请检查容器状态\033[0m"
        return 1
    fi
}

docker_app_uninstall() {
    echo "正在卸载 木序定制 · 全屋定制平台 ..."
    local compose_cmd="docker compose"
    if ! docker compose version >/dev/null 2>&1; then
        compose_cmd="docker-compose"
    fi

    if [ -d "$WHC_BASE_DIR" ] && [ -f "$WHC_BASE_DIR/docker-compose.yml" ]; then
        (cd "$WHC_BASE_DIR" && $compose_cmd down) 2>/dev/null || true
    fi

    # 清理残留容器
    docker rm -f whc-client whc-admin whc-backend whc-mysql 2>/dev/null || true

    # 1. 询问删除数据卷
    echo -e "\033[33m是否同时删除 MySQL 数据卷 (whc-mysql-data)？(y/N, 默认 No)\033[0m"
    local ans_vol="N"
    read -r ans_vol
    if [ "$ans_vol" = "y" ] || [ "$ans_vol" = "Y" ]; then
        docker volume rm whc-mysql-data 2>/dev/null || true
        echo "MySQL 数据卷已删除"
    else
        echo "MySQL 数据卷已保留"
    fi

    # 2. 询问删除构建镜像
    echo -e "\033[33m是否同时删除构建的镜像 (whole-house-* 系列)？(y/N, 默认 No)\033[0m"
    local ans_img="N"
    read -r ans_img
    if [ "$ans_img" = "y" ] || [ "$ans_img" = "Y" ]; then
        docker rmi whole-house-whc-backend whole-house-whc-client whole-house-whc-admin 2>/dev/null || true
        docker rmi $(docker images --filter=reference="*whc-*" -q) 2>/dev/null || true
        echo "镜像已删除"
    else
        echo "镜像已保留"
    fi

    # 3. 询问删除部署及源码目录
    echo -e "\033[33m是否同时删除部署及源码目录 $WHC_BASE_DIR？(y/N, 默认 No)\033[0m"
    local ans_dir="N"
    read -r ans_dir
    if [ "$ans_dir" = "y" ] || [ "$ans_dir" = "Y" ]; then
        rm -rf "$WHC_BASE_DIR" 2>/dev/null || true
        echo "目录 $WHC_BASE_DIR 已删除"
    else
        echo "目录保留: $WHC_BASE_DIR"
    fi

    # 移除 appno 标记
    if declare -f remove_app_id >/dev/null 2>&1; then
        remove_app_id
    elif [ -f /home/docker/appno.txt ]; then
        sed -i '/\b4\b/d' /home/docker/appno.txt 2>/dev/null || true
    fi

    echo -e "\033[32m✅ 卸载完成\033[0m"
}

docker_app_plus
