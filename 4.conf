app_id="4"
app_name="Agent2API 多客户端 AI 网关"
app_category="ai"
app_text="多 AI 桌面客户端反代网关：WorkBuddy/小浣熊/Trae/Qoder 等登录态包装为 OpenAI 兼容 API"
app_size="1"
docker_name="agent2api"
docker_port="3065"
docker_describe="Agent2API 多提供商本地网关（面板 3065，仅监听 127.0.0.1）"
docker_url="https://github.com/gitmeus/agent2api"

A2A_IMG="aimodcc/agent2api:latest"
A2A_BASE_DIR="/home/docker/agent2api"

docker_app_install() {
    clear
    echo -e "\033[96m==================================================\033[0m"
    echo -e "\033[32m  🚀 [z app 4] Agent2API 正在安装...\033[0m"
    echo -e "\033[96m==================================================\033[0m"

    if ! command -v docker >/dev/null 2>&1; then
        echo -e "\033[31m❌ 未检测到 docker，请先安装 Docker 后重试\033[0m"
        return 1
    fi

    # 已安装则提示
    if docker ps -a --format '{{.Names}}' 2>/dev/null | grep -qx "agent2api"; then
        echo -e "\033[33m⚠️ 检测到 agent2api 容器已存在\033[0m"
        if docker ps --format '{{.Names}}' 2>/dev/null | grep -qx "agent2api"; then
            echo -e "\033[32m✅ 容器正在运行中，无需重复安装\033[0m"
        else
            echo -e "\033[33m正在启动已存在的容器...\033[0m"
            docker start agent2api >/dev/null 2>&1
            echo -e "\033[32m✅ 容器已启动\033[0m"
        fi
        echo -e "\033[96m==================================================\033[0m"
        return 0
    fi

    echo -e "\033[33m正在拉取镜像 $A2A_IMG ...\033[0m"
    if ! docker pull "$A2A_IMG"; then
        echo -e "\033[31m❌ 镜像拉取失败，请检查网络后重试\033[0m"
        return 1
    fi

    mkdir -p "$A2A_BASE_DIR/data"

    echo -e "\033[33m正在启动容器...\033[0m"
    if ! docker run -d --name agent2api \
        --restart unless-stopped \
        -p 127.0.0.1:3065:3065 \
        -v "$A2A_BASE_DIR/data:/data" \
        "$A2A_IMG" >/dev/null 2>&1; then
        echo -e "\033[31m❌ 容器启动失败\033[0m"
        return 1
    fi

    # 等待服务就绪
    echo -e "\033[33m等待服务就绪...\033[0m"
    local ok=0
    for i in $(seq 1 20); do
        if curl -fsS --max-time 3 "http://127.0.0.1:3065/" >/dev/null 2>&1; then
            ok=1
            break
        fi
        sleep 2
    done

    echo ""
    if [ "$ok" = "1" ]; then
        echo -e "\033[32m✅ Agent2API 安装完成！\033[0m"
    else
        echo -e "\033[33m⚠️ 容器已启动，但 Web 面板暂未响应，请稍后手动检查\033[0m"
    fi
    echo -e "管理面板: \033[33mhttp://127.0.0.1:3065\033[0m（首次进入需注册管理员账号）"
    echo -e "API 网关: \033[33mhttp://127.0.0.1:3065/v1\033[0m（OpenAI 兼容，需先在面板创建 API Key）"
    echo -e "数据目录: \033[33m$A2A_BASE_DIR/data\033[0m"
    echo -e "\033[96m==================================================\033[0m"
}

docker_app_update() {
    echo "正在更新 Agent2API ..."
    if ! docker ps -a --format '{{.Names}}' 2>/dev/null | grep -qx "agent2api"; then
        echo -e "\033[31m❌ 未检测到 agent2api 容器，请先安装\033[0m"
        return 1
    fi
    echo -e "\033[33m拉取最新镜像...\033[0m"
    docker pull "$A2A_IMG" || {
        echo -e "\033[31m❌ 镜像拉取失败\033[0m"
        return 1
    }
    echo -e "\033[33m重建容器（数据卷保留）...\033[0m"
    docker rm -f agent2api >/dev/null 2>&1
    docker run -d --name agent2api \
        --restart unless-stopped \
        -p 127.0.0.1:3065:3065 \
        -v "$A2A_BASE_DIR/data:/data" \
        "$A2A_IMG" >/dev/null 2>&1
    echo -e "\033[32m✅ 更新完成\033[0m"
}

docker_app_uninstall() {
    echo "正在卸载 Agent2API ..."
    docker rm -f agent2api 2>/dev/null || true
    # 可选删除镜像
    echo -e "\033[33m是否同时删除镜像 $A2A_IMG？(y/N)\033[0m"
    local ans_img
    read -r ans_img
    if [ "$ans_img" = "y" ] || [ "$ans_img" = "Y" ]; then
        docker rmi "$A2A_IMG" 2>/dev/null || true
        echo "镜像已删除"
    fi
    if [ -d "$A2A_BASE_DIR" ]; then
        echo -e "\033[33m是否同时删除数据目录 $A2A_BASE_DIR（含账号配置与数据库）？(y/N)\033[0m"
        local ans
        read -r ans
        if [ "$ans" = "y" ] || [ "$ans" = "Y" ]; then
            rm -rf "$A2A_BASE_DIR"
            echo "数据目录已删除"
        else
            echo "数据目录保留：$A2A_BASE_DIR"
        fi
    fi
    echo -e "\033[32m✅ 卸载完成\033[0m"
}

docker_app_plus
